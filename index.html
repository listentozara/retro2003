<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17120f" />
  <meta name="description" content="ZARA — artist, DJ, producer and vocalist. Since 2023." />
  <title>ZARA — Since 2023</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="site-shell" id="siteShell">
    <div class="hero" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <button class="logo-button" id="logoButton" aria-label="Open ZARA bio" aria-haspopup="dialog">
      <img src="assets/zara-logo-white.png" alt="ZARA" class="logo" />
      <span class="vhs-ghost ghost-a" aria-hidden="true"></span>
      <span class="vhs-ghost ghost-b" aria-hidden="true"></span>
    </button>

    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/listentozara_" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle class="fill" cx="17.4" cy="6.7" r="1.1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@listentozara_" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.2 3v11.1a4.6 4.6 0 1 1-3.8-4.5v3.1a1.7 1.7 0 1 0 .8 1.4V3h3c.3 2.5 1.7 4 4.8 4.4v3c-2-.1-3.6-.8-4.8-1.9"/></svg>
      </a>
      <span class="disabled" aria-label="YouTube — link coming soon" title="YouTube — coming soon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8.1c-.2-1.5-1.1-2.4-2.6-2.6C16.7 5.2 14.6 5 12 5s-4.7.2-6.4.5C4.1 5.7 3.2 6.6 3 8.1 2.8 9.2 2.7 10.5 2.7 12s.1 2.8.3 3.9c.2 1.5 1.1 2.4 2.6 2.6 1.7.3 3.8.5 6.4.5s4.7-.2 6.4-.5c1.5-.2 2.4-1.1 2.6-2.6.2-1.1.3-2.4.3-3.9s-.1-2.8-.3-3.9Z"/><path class="fill-bg" d="m10 9 5 3-5 3Z"/></svg>
      </span>
      <a href="https://on.soundcloud.com/mN0PzYFoOUpYmzA3bW" target="_blank" rel="noopener noreferrer" aria-label="SoundCloud">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 14.2v2.2M4 12.7v5M6.5 11.4v7.2M9 10.6v8.1M11.5 9.5v9.2M13.3 18.7h5.1a3.9 3.9 0 0 0 .4-7.8 5.5 5.5 0 0 0-10.5-1.6"/></svg>
      </a>
    </nav>
  </main>

  <section class="overlay" id="bioOverlay" aria-hidden="true">
    <button class="overlay-close" id="overlayClose" aria-label="Close bio"></button>
    <div class="bio-card" role="dialog" aria-modal="true" aria-labelledby="bioTitle">
      <button class="close-button" id="closeButton" aria-label="Close">×</button>
      <p id="bioTitle" class="bio-text">Since 2023</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
